  .card { background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 6px 24px rgba(40,30,120,.10); }

  .or { margin:18px 0 10px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .upi { display:flex; gap:8px; align-items:center; justify-content:space-between; background:#F7F6FD; border:1px dashed #b9b3f0;

  .upi span { font-weight:700; font-size:15px; word-break:break-all; }
  .upi button { flex:none; border:0; background:var(--brand); color:#fff; font-weight:700; border-radius:10px; padding:10px 14px; font-size:14px; cursor:pointer; }
  .hint { font-size:13px; color:var(--muted); margin:8px 0 0; line-height:1.5; }
  .qr img { width:220px; height:220px; image-rendering:pixelated; margin-top:6px; }
  .steps { text-align:left; background:#FFF8E6; border-radius:12px; padding:12px 14px; margin-top:18px; font-size:14px; line-height:1.55; }
  .steps b { color:#7a4b00; }
  .fees { margin:12px 0 20px; border:1px solid #e6e3f7; border-radius:14px; overflow:hidden; text-align:left; }
  .fees div { display:flex; justify-content:space-between; padding:12px 14px; font-size:16px; }
  .fees div + div { border-top:1px solid #eeecf9; }
  .fees b { font-size:18px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ok); color:#fff; padding:10px 16px;
           border-radius:999px; font-weight:600; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .desktop-only { display:none; }
  @media (hover:hover) and (pointer:fine) { .desktop-only { display:block; } }
</style>

  const t = fixed || { label: "Registration fee", amount: null, note: "BNI Anniversary Registration" };
  const qrKey = fixed ? key : "any";
  const body = document.getElementById("body");

  {
    const params = "pa=" + VPA + "&pn=" + encodeURIComponent(NAME) +
                   (t.amount ? "&am=" + t.amount.toFixed(2) : "") + "&cu=INR&tn=" + encodeURIComponent(t.note);
    const rupees = t.amount ? "₹" + t.amount.toLocaleString("en-IN") : "your fee";
    const top = t.amount
      ? `<p class="type">${t.label}</p><div class="amount">${rupees}</div>`
      : `<p class="type">Choose your fee and enter it in the app</p>
         <div class="fees">
           <div><span>Kings Chapter Member</span><b>₹2,000</b></div>
           <div><span>Cross-Chapter Member</span><b>₹1,200</b></div>
           <div><span>Visitor</span><b>₹800</b></div>
         </div>`;
    body.innerHTML = `
      ${top}

      <a class="btn main" href="upi://pay?${params}">Pay ${t.amount ? rupees + " " : ""}with UPI app</a>
      <a class="btn alt" href="tez://upi/pay?${params}">Open Google Pay</a>
      <a class="btn alt" href="phonepe://pay?${params}">Open PhonePe</a>

      <div class="or">If the buttons don't work</div>
      <div class="upi"><span>${VPA}</span><button type="button" id="copy">Copy</button></div>
      <p class="hint">Open GPay → <b>Pay UPI ID or number</b> → paste → pay <b>${rupees}</b></p>

      <div class="desktop-only qr">
        <div class="or">On a computer? Scan with your phone</div>
        <img alt="UPI QR code for ${rupees}" src="data:image/png;base64,${QR[qrKey]}">
      </div>

      <div class="steps">
        <b>After paying:</b><br>
        1. Note the <b>UPI transaction ID</b> (12 digits) in your payment app.<br>
        2. Go back to the registration form and enter it.<br>
        3. Send the payment screenshot on WhatsApp to <b>9787015703</b>.
      </div>`;

    document.getElementById("copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(VPA); }
      catch (e) {
        const r = document.createRange(); r.selectNodeContents(document.querySelector(".upi span"));
        const s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand("copy");
      }
      const toast = document.getElementById("toast");
      toast.classList.add("show"); setTimeout(() => toast.classList.remove("show"), 1600);
    });
